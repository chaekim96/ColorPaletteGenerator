# Weekly refresh of the Explore page: scan the curated sites, commit the new trending.json,
# and let Vercel redeploy from main.
name: Scan trending palettes

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run scan
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- src/data/trending.json; then
            echo "No changes"
            exit 0
          fi
          # Vercel (Hobby) only deploys commits GitHub links to the account owner on private repos,
          # so the data commit uses the owner's GitHub noreply identity rather than github-actions[bot].
          git config user.name "Chae Kim"
          git config user.email "243254087+chaekim96@users.noreply.github.com"
          git add src/data/trending.json
          git commit -m "Refresh trending palettes ($(date -u +%Y-%m-%d))"
          git push
